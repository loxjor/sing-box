name: Build Universal libsing-box.so (Android)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip android-ndk-r26c-linux.zip

      - name: Build for all architectures
        run: |
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26c
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          mkdir out

          ### ARMv7
          GOOS=android GOARCH=arm CGO_ENABLED=1 \
          CC=armv7a-linux-androideabi21-clang \
          go build -buildmode=c-shared -tags with_quic,with_utls \
            -o out/libsing-box-arm.so

          ### ARM64
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -tags with_quic,with_utls \
            -o out/libsing-box-arm64.so

          ### x86
          GOOS=android GOARCH=386 CGO_ENABLED=1 \
          CC=i686-linux-android21-clang \
          go build -buildmode=c-shared -tags with_quic,with_utls \
            -o out/libsing-box-x86.so

          ### x86_64
          GOOS=android GOARCH=amd64 CGO_ENABLED=1 \
          CC=x86_64-linux-android21-clang \
          go build -buildmode=c-shared -tags with_quic,with_utls \
            -o out/libsing-box-x86_64.so

      - name: Create universal archive
        run: |
          cd out
          zip -r ../libsing-box-universal.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: libsing-box-universal
          path: libsing-box-universal.zip
