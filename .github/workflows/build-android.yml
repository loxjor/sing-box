name: Build Sing-Box for Android (ARM64)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # важно!

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip android-ndk-r26c-linux.zip

      - name: Build libsing-box.so (arm64)
        run: |
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26c
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          # 🔧 Fix "Calculate version" error
          export BUILD_VERSION="1.0"
          export BUILD_COMMIT="manual"

          GOOS=android \
          GOARCH=arm64 \
          CGO_ENABLED=1 \
          CC=aarch64-linux-android21-clang \
          go build \
            -buildmode=c-shared \
            -tags with_quic,with_utls \
            -o libsing-box-arm64.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: libsing-box-android-arm64
          path: libsing-box-arm64.so
