name: Build Sing-Box AAR (ARM64)

on:
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip android-ndk-r26c-linux.zip

      - name: Build libsing-box.so (arm64)
        run: |
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26c
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          mkdir -p aar/jni/arm64-v8a

          GOOS=android \
          GOARCH=arm64 \
          CGO_ENABLED=1 \
          CC=aarch64-linux-android21-clang \
          go build \
            -buildmode=c-shared \
            -tags with_quic,with_utls \
            -o aar/jni/arm64-v8a/libsing-box.so

      - name: Prepare AAR structure
        run: |
          mkdir -p aar/manifest
          mkdir -p aar/classes
          mkdir -p aar/R
          
          # пустой AndroidManifest, AAR требует его обязательного наличия
          cat > aar/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.singbox.stub" />
          EOF
          
          # пустой classes.jar нужен для корректного AAR
          touch empty.txt
          zip -j aar/classes.jar empty.txt
          rm empty.txt

      - name: Build AAR
        run: |
          cd aar
          zip -r ../sing-box-arm64.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v3
        with:
          name: sing-box-arm64
          path: sing-box-arm64.aar
