name: Build Sing-Box AAR (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main  # workflow будет запускаться автоматически при пуше в main

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 2. Install Go
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      # 3. Download Android NDK
      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip android-ndk-r26c-linux.zip

      # 4. Build libsing-box.so (ARM64) — указываем пакет main
      - name: Build libsing-box.so (arm64)
        run: |
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26c
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          mkdir -p aar/jni/arm64-v8a

          GOOS=android \
          GOARCH=arm64 \
          CGO_ENABLED=1 \
          CC=aarch64-linux-android21-clang \
          go build \
            -buildmode=c-shared \
            -tags with_quic,with_utls \
            -o aar/jni/arm64-v8a/libsing-box.so ./cmd/libsing-box

      # 5. Prepare AAR structure
      - name: Prepare AAR structure
        run: |
          # Создаём пустой манифест
          cat > aar/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.singbox.stub" />
          EOF

          # Создаём пустой classes.jar
          mkdir -p aar/classes
          touch empty.txt
          zip -j aar/classes.jar empty.txt
          rm empty.txt

      # 6. Build AAR
      - name: Build AAR
        run: |
          cd aar
          zip -r ../sing-box-arm64.aar .

      # 7. Upload AAR artifact (v4)
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-arm64
          path: sing-box-arm64.aar
